<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memori Bleach</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    html { overflow-x: hidden; background: #3b1d5e; }
    :root { --accent: #ff6a00; --spark: #ffcf8a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', Arial, sans-serif;
      /* fallback: kalau JS/layer gagal, tetap ada latar senja, bukan hitam */
      background: #c2410c;
      background: linear-gradient(to top,#ff7b3d,#c2410c 40%,#3b1d5e 100%) fixed;
      color: #f5f5f5;
      min-height: 100vh; display: block;
      padding: 30px 16px; overflow-x: hidden;
    }
    #scene { position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden; }
    .layer { position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 1.2s ease; }
    .layer.aktif { opacity: 1; }
    .kanji {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 45vw; font-weight: 900; color: #fff; opacity: 0.06; white-space: nowrap;
    }
    .orb { position: absolute; top: 9%; right: 10%; width: 22vw; height: 22vw; max-width: 260px; max-height: 260px; min-width: 120px; min-height: 120px; border-radius: 50%; }
    .city { position: absolute; bottom: 0; left: 0; width: 100%; height: 36vh; }
    #sparks { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .spark {
      position: absolute; bottom: -10px; border-radius: 50%;
      background: var(--spark); box-shadow: 0 0 8px var(--spark);
      opacity: 0; animation: naik linear infinite;
    }
    @keyframes naik {
      0%   { transform: translateY(0) translateX(0); opacity: 0; }
      10%  { opacity: 0.9; }
      100% { transform: translateY(-105vh) translateX(40px); opacity: 0; }
    }

    .box {
      position: relative; z-index: 1;
      background: rgba(8,8,18,0.85);
      border-left: 8px solid var(--accent);
      width: 100%; max-width: 460px; margin: 0 auto; padding: 24px 20px;
      transition: border-color 1s;
    }
    h1 { font-family: 'Anton', Impact, sans-serif; font-size: 32px; letter-spacing: 3px; text-transform: uppercase; }
    h1 span { color: var(--accent); transition: color 1s; }
    .lokasi {
      font-family: 'Anton', Impact, sans-serif; letter-spacing: 3px; font-size: 13px;
      color: var(--accent); margin: 2px 0 14px; text-transform: uppercase; transition: color 1s;
    }
    .info { display: flex; justify-content: space-between; font-size: 13px; letter-spacing: 2px; margin-bottom: 8px; }
    .bar { height: 10px; background: rgba(255,255,255,0.15); margin-bottom: 14px; }
    .bar i { display: block; height: 100%; width: 0; background: var(--accent); box-shadow: 0 0 10px var(--accent); transition: width 0.4s, background 1s; }

    .papan { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
    .kartu {
      position: relative; cursor: pointer;
      background: none; border: none; perspective: 600px; padding: 0;
    }
    /* trik persegi, jalan di browser lama yang belum paham aspect-ratio */
    .kartu::before { content: ""; display: block; padding-top: 100%; }
    .dalam {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0; transform-style: preserve-3d;
      transition: transform 0.45s;
    }
    .kartu.buka .dalam, .kartu.cocok .dalam { transform: rotateY(180deg); }
    .muka {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      -webkit-backface-visibility: hidden; backface-visibility: hidden;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid #f5f5f5;
    }
    .depan {
      background: rgba(255,255,255,0.08);
      font-family: 'Anton', Impact, sans-serif; font-size: 28px; color: var(--accent);
      transition: border-color 1s, color 1s;
    }
    .kartu:hover:not(.buka):not(.cocok) .depan { background: #f5f5f5; color: #000; }
    .belakang {
      transform: rotateY(180deg); background: #ffffff; color: #111111;
      font-size: 40px; line-height: 1;
    }
    .kartu.cocok .belakang { border-color: #1fa855; background: #d9f7e4; color: #111111; }
    .kartu:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    .btn {
      font-family: 'Anton', Impact, sans-serif; font-size: 18px; letter-spacing: 2px; text-transform: uppercase;
      background: var(--accent); color: #000; border: none; padding: 12px 28px; cursor: pointer; transition: background 1s;
    }
    .btn:hover { background: #fff; }
    .pesan { margin-top: 12px; font-size: 14px; min-height: 20px; opacity: 0.9; }
    .rekor { font-size: 12px; letter-spacing: 2px; opacity: 0.7; margin-top: 6px; }
    #bankai {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.6);
      font-family: 'Anton', Impact, sans-serif;
      font-size: 16vw; letter-spacing: 6px; color: #ffd400;
      text-shadow: 0 0 30px #ff3d00, 0 0 70px #ff3d00;
      z-index: 5; opacity: 0; pointer-events: none; white-space: nowrap;
    }
    #bankai.muncul { animation: bankai 2.2s ease forwards; }
    @keyframes bankai {
      0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
      20%  { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
      70%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.3); }
    }
    @media (prefers-reduced-motion: reduce) { .dalam { transition: none; } .spark { animation: none; } }

    /* ===== TOMBOL KEMBALI KE MENU AWAL (PORTOFOLIO ROBIN) ===== */
    .menu-robin {
      position: fixed; left: 14px; bottom: 14px; z-index: 50;
      font-family: 'Anton', Impact, sans-serif; font-size: 14px; letter-spacing: 2px; text-transform: uppercase;
      text-decoration: none; color: #f5f5f5;
      background: rgba(8,8,18,0.85); border: 2px solid #f5f5f5;
      padding: 8px 14px; transition: all 0.2s;
    }
    .menu-robin:hover { background: #f5f5f5; color: #000; transform: translateY(-2px); }
    body { padding-bottom: 64px !important; }
  </style>
</head>
<body>
  <a class="menu-robin" href="https://muqorobin298-lab.github.io/Robin_Dev/">← Menu Awal</a>

  <div id="scene"></div>
  <div id="sparks"></div>
  <div id="bankai">BANKAI!</div>

  <div class="box">
    <h1>Memori <span>Bleach</span></h1>
    <p class="lokasi" id="lokasi"></p>

    <div class="info"><span id="langkah"></span><span id="waktu"></span><span id="pasang"></span></div>
    <div class="bar"><i id="bar"></i></div>

    <div class="papan" id="papan"></div>

    <button class="btn" id="ulang">Acak Ulang</button>
    <p class="pesan" id="pesan"></p>
    <p class="rekor" id="rekor"></p>
  </div>

  <script>
    const tema = {
      senja:  { nama: "Senja Karakura", kanji: "代行", g: "linear-gradient(to top,#ff7b3d,#c2410c 40%,#3b1d5e 100%)", orb: "radial-gradient(circle,#fff3c4 0%,#ffd27a 60%,#ff9a3c 100%)", glow: "#ffb347", city: "#1a0a12", accent: "#ff6a00", spark: "#ffcf8a" },
      malam:  { nama: "Malam Bersalju", kanji: "月", g: "linear-gradient(to top,#2a4a7a,#10234a 50%,#030818 100%)", orb: "radial-gradient(circle,#ffffff 0%,#dbeafe 70%,#a5c8ff 100%)", glow: "#bcd8ff", city: "#050b1a", accent: "#4da6ff", spark: "#d6e8ff" },
      sakura: { nama: "Hujan Sakura", kanji: "桜", g: "linear-gradient(to top,#ff9ec4,#a8326b 45%,#2a0b2e 100%)", orb: "radial-gradient(circle,#fff0f6 0%,#ffc2da 70%,#ff8fba 100%)", glow: "#ffb3d1", city: "#1f0720", accent: "#ff5c9e", spark: "#ffd0e3" },
      es:     { nama: "Istana Es", kanji: "氷", g: "linear-gradient(to top,#b8ecff,#2a8fc7 45%,#062a4d 100%)", orb: "radial-gradient(circle,#ffffff 0%,#e0f7ff 70%,#9fe3ff 100%)", glow: "#aeeaff", city: "#04182e", accent: "#38d4ff", spark: "#ffffff" },
      bankai: { nama: "BANKAI!", kanji: "卍解", g: "linear-gradient(to top,#ff7b3d,#7a0b1b 45%,#2b0008 100%)", orb: "radial-gradient(circle,#fffbe0 0%,#ffe9b0 60%,#ffd400 100%)", glow: "#ffd400", city: "#1a0004", accent: "#ffd400", spark: "#ffe28a" }
    };
    const urutan = Object.keys(tema);

    const kota = `<svg class="city" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMax slice" fill="CITYCOLOR">
      <rect x="0" y="270" width="1200" height="30"/>
      <path d="M90 270 V190 H130 V270 Z"/><path d="M70 195 Q110 185 150 195 L135 170 H85 Z"/><path d="M85 170 Q110 160 135 170 L125 150 H95 Z"/><path d="M95 150 L110 125 L125 150 Z"/>
      <path d="M200 270 V215 H420 V270 Z"/><path d="M180 220 Q310 195 440 220 L410 200 H210 Z"/>
      <path d="M520 270 V160 H580 V270 Z"/><path d="M495 165 Q550 150 605 165 L585 135 H515 Z"/><path d="M512 135 Q550 120 588 135 L575 108 H525 Z"/><path d="M525 108 Q550 95 575 108 L562 82 H538 Z"/><path d="M540 82 L550 50 L560 82 Z"/>
      <path d="M680 270 V220 H860 V270 Z"/><path d="M660 225 Q770 200 880 225 L850 205 H690 Z"/>
      <path d="M930 270 V185 H980 V270 Z"/><path d="M910 190 Q955 178 1000 190 L985 165 H925 Z"/><path d="M925 165 Q955 152 985 165 L975 140 H935 Z"/><path d="M938 140 L955 112 L972 140 Z"/>
      <path d="M1060 270 V225 H1200 V270 Z"/><path d="M1045 230 Q1130 208 1215 230 L1190 212 H1070 Z"/>
    </svg>`;

    const scene = document.getElementById("scene");
    const layers = {};
    urutan.forEach(k => {
      const t = tema[k];
      const d = document.createElement("div");
      d.className = "layer";
      d.style.background = t.g;
      d.innerHTML =
        '<div class="kanji">' + t.kanji + '</div>' +
        '<div class="orb" style="background:' + t.orb + ';box-shadow:0 0 40px ' + t.glow + ',0 0 110px ' + t.glow + '"></div>' +
        kota.replace("CITYCOLOR", t.city);
      scene.appendChild(d);
      layers[k] = d;
    });

    const sparks = document.getElementById("sparks");
    for (let n = 0; n < 35; n++) {
      const s = document.createElement("div");
      s.className = "spark";
      const size = 2 + Math.random() * 4;
      s.style.width = s.style.height = size + "px";
      s.style.left = Math.random() * 100 + "%";
      s.style.animationDuration = (6 + Math.random() * 8) + "s";
      s.style.animationDelay = (Math.random() * 10) + "s";
      sparks.appendChild(s);
    }

    let aktif = "";
    function gantiTema(k) {
      if (k === aktif) return;
      aktif = k;
      const t = tema[k];
      urutan.forEach(n => layers[n].classList.toggle("aktif", n === k));
      document.documentElement.style.setProperty("--accent", t.accent);
      document.documentElement.style.setProperty("--spark", t.spark);
      document.getElementById("lokasi").textContent = "// " + t.nama;
    }

    // ===== LOGIKA GAME =====
    const $ = id => document.getElementById(id);
    const simbol = ["死", "神", "卍", "解", "月", "氷", "桜", "刀"];
    const TOTAL = simbol.length;

    let kartu = [], terbuka = [], kunci = false;
    let langkah = 0, cocok = 0, detik = 0, timer = null, mulaiMain = false;
    let rekor = null;
    try { rekor = JSON.parse(localStorage.getItem("memoriBleachRekor")); } catch (e) { rekor = null; }

    function format(d) {
      return String(Math.floor(d / 60)).padStart(2, "0") + ":" + String(d % 60).padStart(2, "0");
    }

    function tampilInfo() {
      $("langkah").textContent = "LANGKAH " + langkah;
      $("waktu").textContent = format(detik);
      $("pasang").textContent = "PASANG " + cocok + "/" + TOTAL;
      $("bar").style.width = (cocok / TOTAL * 100) + "%";
      $("rekor").textContent = rekor ? "REKOR: " + rekor.langkah + " LANGKAH, " + format(rekor.detik) : "";
    }

    function temaProgres() {
      if (cocok >= TOTAL) return "bankai";
      const siklus = ["senja", "malam", "sakura", "es"];
      return siklus[cocok % siklus.length]; // ganti warna setiap 1 pasangan cocok
    }

    function acak(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function mulai() {
      clearInterval(timer);
      langkah = 0; cocok = 0; detik = 0; terbuka = []; kunci = false; mulaiMain = false;
      $("pesan").textContent = "Balik dua kartu dan cari pasangannya.";
      $("papan").innerHTML = "";
      kartu = acak(simbol.concat(simbol));
      kartu.forEach((s, i) => {
        const b = document.createElement("button");
        b.className = "kartu";
        b.setAttribute("aria-label", "Kartu " + (i + 1));
        b.innerHTML =
          '<div class="dalam"><div class="muka depan">?</div><div class="muka belakang">' + s + '</div></div>';
        b.onclick = () => balik(b, s);
        $("papan").appendChild(b);
      });
      aktif = ""; gantiTema("senja");
      tampilInfo();
    }

    function balik(el, s) {
      if (kunci || el.classList.contains("buka") || el.classList.contains("cocok")) return;
      if (!mulaiMain) {
        mulaiMain = true;
        timer = setInterval(() => { detik++; $("waktu").textContent = format(detik); }, 1000);
      }
      el.classList.add("buka");
      terbuka.push({ el, s });

      if (terbuka.length === 2) {
        langkah++;
        kunci = true;
        const [a, b] = terbuka;
        if (a.s === b.s) {
          setTimeout(() => {
            a.el.classList.remove("buka"); b.el.classList.remove("buka");
            a.el.classList.add("cocok"); b.el.classList.add("cocok");
            cocok++;
            terbuka = []; kunci = false;
            gantiTema(temaProgres());
            tampilInfo();
            if (cocok === TOTAL) menang();
            else $("pesan").textContent = "Cocok! Tinggal " + (TOTAL - cocok) + " pasang lagi.";
          }, 350);
        } else {
          $("pesan").textContent = "Belum cocok, ingat posisinya.";
          setTimeout(() => {
            a.el.classList.remove("buka"); b.el.classList.remove("buka");
            terbuka = []; kunci = false;
          }, 800);
        }
        tampilInfo();
      }
    }

    function menang() {
      clearInterval(timer);
      $("pesan").textContent = "Semua pasangan ketemu dalam " + langkah + " langkah dan " + format(detik) + ". Bankai!";
      const b = $("bankai");
      b.classList.remove("muncul"); void b.offsetWidth; b.classList.add("muncul");
      if (!rekor || langkah < rekor.langkah || (langkah === rekor.langkah && detik < rekor.detik)) {
        rekor = { langkah, detik };
        try { localStorage.setItem("memoriBleachRekor", JSON.stringify(rekor)); } catch (e) {}
        $("pesan").textContent += " Rekor baru!";
      }
      tampilInfo();
    }

    $("ulang").onclick = mulai;
    mulai();
  </script>
</body>
</html>
